name: Release Build

on:
  push:
    tags: ['v*']
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build release binary
        run: cargo build --release

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/release/finance-game-cli dist/
          tar -czf dist/finance-game-linux-x86_64.tar.gz -C dist finance-game-cli
          sha256sum dist/finance-game-linux-x86_64.tar.gz > dist/SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: finance-game-release
          path: |
            dist/finance-game-cli
            dist/finance-game-linux-x86_64.tar.gz
            dist/SHA256SUMS

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/finance-game-linux-x86_64.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
