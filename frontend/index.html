<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="description" content="Fintrack — track bank accounts, assets, deposits, investments, income and expenses." />
    <meta name="theme-color" content="#0d0c0c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fintrack" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Every style preset pairs a Google Fonts family (see the per-style files in
         src/theme/styles/). One combined request: the CSS is ~95 KB but the browser
         only downloads the faces a rendered style actually uses, so an inactive
         theme costs nothing but the stylesheet. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Fira+Sans:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,400..700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@600;700&family=Inter:wght@400..800&family=JetBrains+Mono:wght@400;500&family=Karla:wght@400;500;600;700&family=Nunito+Sans:wght@300;400;600;700&family=Orbitron:wght@700;900&family=Playfair+Display:wght@400..900&family=Playfair+Display+SC:wght@400;700&family=Plus+Jakarta+Sans:wght@400..700&family=Press+Start+2P&family=Roboto:wght@300;400;500;700&family=Space+Grotesk:wght@500;700&family=VT323&family=Varela+Round&display=swap"
    />
    <title>Fintrack</title>
    <script>
      /* Inline and blocking on purpose: the theme has to be on <html> before the
         first paint, and a module or deferred script runs too late to stop the
         flash. The defaults below must stay in sync with
         src/composables/useTheme.ts. data-style selects the visual style whose
         [data-style=…] palette rules live in src/theme/app.css, so setting the
         attribute is enough for them to apply on the first painted frame. */
      ;(function () {
        var mode = 'system'
        var accent = 'blue'
        var density = 'comfortable'
        var style = 'flexoki'
        var font = 'system'
        var styles = [
          'flexoki',
          'minimalism',
          'flat',
          'material',
          'bento',
          'glassmorphism',
          'neumorphism',
          'claymorphism',
          'skeuomorphism',
          'neobrutalism',
          'liquidglass',
          'y2k',
          'cyberpunk'
        ]
        var fonts = ['system', 'inter', 'sans', 'serif', 'rounded']
        try {
          var raw = localStorage.getItem('fintrack:theme')
          var parsed = raw ? JSON.parse(raw) : null
          if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
            if (parsed.mode === 'light' || parsed.mode === 'dark' || parsed.mode === 'system') {
              mode = parsed.mode
            }
            if (['blue', 'indigo', 'violet', 'sky', 'rose', 'amber'].indexOf(parsed.accent) !== -1) {
              accent = parsed.accent
            }
            if (parsed.density === 'comfortable' || parsed.density === 'compact') {
              density = parsed.density
            }
            /* a bag saved before styles existed simply keeps the default */
            if (styles.indexOf(parsed.style) !== -1) {
              style = parsed.style
            }
            /* a bag saved before fonts existed keeps the system default */
            if (fonts.indexOf(parsed.font) !== -1) {
              font = parsed.font
            }
          }
        } catch (e) {
          /* corrupt or blocked storage: fall through to the defaults */
        }
        var systemDark =
          typeof window.matchMedia === 'function'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : true
        var dark = mode === 'dark' || (mode === 'system' && systemDark)
        /* Per-style pre-paint colour, mirrored from --bg in
           src/theme/styles/*.css (and useTheme.ts PAGE_BG). A style that paints
           cream over a neon page — or the reverse — is a visible flash, so the
           background is part of the pre-paint contract, not just the attribute. */
        var styleBg = {
          flexoki: ['#fffcf0', '#0d0c0c'],
          minimalism: ['#ffffff', '#0f0f0f'],
          flat: ['#f8f9fa', '#111315'],
          material: ['#f7f9fc', '#101418'],
          bento: ['#f6f7fb', '#0c1026'],
          glassmorphism: ['#f2f4f8', '#05070f'],
          neumorphism: ['#e6e9ef', '#14171c'],
          claymorphism: ['#f2ebe2', '#1a1610'],
          skeuomorphism: ['#dcdcdc', '#161616'],
          neobrutalism: ['#ffffff', '#0a0a0a'],
          liquidglass: ['#f1f5ff', '#040814'],
          y2k: ['#e8e5ff', '#050510'],
          cyberpunk: ['#fafbfc', '#050505']
        }
        var pair = styleBg[style] || styleBg.flexoki
        var bg = dark ? pair[1] : pair[0]
        var el = document.documentElement
        el.setAttribute('data-theme', dark ? 'dark' : 'light')
        el.setAttribute('data-accent', accent)
        el.setAttribute('data-density', density)
        el.setAttribute('data-style', style)
        /* the font override mirrors useTheme: system = no attribute at all */
        if (font !== 'system') el.setAttribute('data-font', font)
        el.style.setProperty('--boot-bg', bg)
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', bg)
      })()
    </script>
    <style>
      :root { --boot-bg: #0d0c0c; }
      html, body, #app { height: 100%; margin: 0; background: var(--boot-bg); overscroll-behavior: none; }
      body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
